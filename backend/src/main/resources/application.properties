spring.application.name=futuretech-backend

# --- PostgreSQL connection ---
# Values come from environment variables. The URL and username have local defaults;
# the password has NO default and must be set via the DB_PASSWORD environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/futuretech}
spring.datasource.username=${DB_USERNAME:futuretech_app}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Flyway creates and changes tables; Hibernate only checks that entities match them.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep DB sessions open during web requests (avoids hidden lazy-loading queries in controllers).
spring.jpa.open-in-view=false

# --- Admin account (created once at startup by AdminAccountInitializer) ---
# Set ADMIN_EMAIL and ADMIN_PASSWORD as environment variables; never write them here.
futuretech.admin.email=${ADMIN_EMAIL:}
futuretech.admin.password=${ADMIN_PASSWORD:}

# --- Security (read by SecurityProperties) ---
# JWT signing secret: REQUIRED, at least 32 characters, only via the JWT_SECRET env var.
futuretech.security.jwt-secret=${JWT_SECRET}
futuretech.security.access-token-lifetime=15m
futuretech.security.refresh-token-lifetime=7d
# Secure cookies are only sent over HTTPS. Local dev runs on plain http, so false by default.
futuretech.security.cookie-secure=${COOKIE_SECURE:false}
futuretech.security.max-failed-logins=5
futuretech.security.lock-duration=15m
futuretech.security.login-attempts-per-minute=10
# Which frontend addresses may call the API (comma-separated)
futuretech.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
